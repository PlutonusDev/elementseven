services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: element7
      POSTGRES_PASSWORD: element7
      POSTGRES_DB: element7
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U element7 -d element7"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
